<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PetShop | Iniciar sesión</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>

<header>

    <div class="logo">
        🐾 PetShop
    </div>

    <nav>

        <a href="index.html">Inicio</a>

        <a href="productos.html">Productos</a>

        <a href="carrito.html">Carrito 🛒</a>

    </nav>

</header>


<main class="formulario-contenedor">

    <div class="formulario">

        <h1>Iniciar sesión</h1>

        <p>
            Ingresa a tu cuenta para realizar tus pedidos.
        </p>


        <form id="loginForm">

            <label for="loginCorreo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="loginCorreo"
                placeholder="correo@ejemplo.com"
                required>


            <label for="loginPassword">
                Contraseña
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Ingrese su contraseña"
                required>


            <button
                type="submit"
                class="boton">

                Iniciar sesión

            </button>

        </form>


        <p class="formulario-link">

            ¿No tienes una cuenta?

            <a href="registro.html">
                Regístrate aquí
            </a>

        </p>

    </div>

</main>


<footer>

    <p>🐾 PetShop</p>

</footer>


<script src="js/script.js"></script>

</body>
</html>
